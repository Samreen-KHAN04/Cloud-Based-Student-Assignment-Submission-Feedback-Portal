openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cloud-Based Student Assignment Submission and Feedback Portal API
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: assignments
  - name: submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Student dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
  /dashboard/teacher:
    get:
      operationId: getTeacherDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
  /assignments:
    get:
      operationId: getAssignments
      tags: [assignments]
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
  /assignments/{assignmentId}:
    get:
      operationId: getAssignment
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    put:
      operationId: updateAssignment
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "204":
          description: Deleted
  /assignments/{assignmentId}/submit:
    post:
      operationId: submitAssignment
      tags: [submissions]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/me:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      responses:
        "200":
          description: Current student's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
  /assignments/{assignmentId}/submissions:
    get:
      operationId: getAssignmentSubmissions
      tags: [submissions]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
  /submissions/{submissionId}/grade:
    post:
      operationId: gradeSubmission
      tags: [submissions]
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "200":
          description: Graded submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/{submissionId}/download:
    get:
      operationId: downloadSubmission
      tags: [submissions]
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: Download reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
components:
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [student, teacher] }
    Session:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        role: { type: string, enum: [student, teacher], default: student }
    Assignment:
      type: object
      required: [id, title, description, course, deadline, maxMarks, allowedFileTypes, maxFileSize, status, submissionCount]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        course: { type: string }
        deadline: { type: string, format: date-time }
        maxMarks: { type: integer }
        allowedFileTypes:
          type: array
          items: { type: string }
        maxFileSize: { type: integer }
        status: { type: string, enum: [open, closed] }
        submissionCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AssignmentInput:
      type: object
      required: [title, description, course, deadline, maxMarks, allowedFileTypes, maxFileSize]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 1 }
        course: { type: string, minLength: 1 }
        deadline: { type: string, format: date-time }
        maxMarks: { type: integer, minimum: 1 }
        allowedFileTypes:
          type: array
          items: { type: string }
        maxFileSize: { type: integer, minimum: 1 }
    Submission:
      type: object
      required: [id, assignmentId, assignmentTitle, studentName, fileName, submittedAt, status, version]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        assignmentTitle: { type: string }
        studentName: { type: string }
        fileName: { type: string }
        submittedAt: { type: string, format: date-time }
        status: { type: string, enum: [SUBMITTED, LATE, GRADED] }
        version: { type: integer }
        marks: { type: ["integer", "null"] }
        feedback: { type: ["string", "null"] }
        gradedAt: { type: ["string", "null"], format: date-time }
    SubmissionInput:
      type: object
      required: [fileName, fileSize]
      properties:
        fileName: { type: string }
        fileSize: { type: integer }
    GradeInput:
      type: object
      required: [marks, feedback]
      properties:
        marks: { type: integer, minimum: 0 }
        feedback: { type: string }
    Download:
      type: object
      required: [fileName, storagePath]
      properties:
        fileName: { type: string }
        storagePath: { type: string }
    StudentDashboard:
      type: object
      required: [studentName, totalAssignments, pendingAssignments, submittedAssignments, lateAssignments, gradedAssignments, upcomingDeadlines, recentFeedback]
      properties:
        studentName: { type: string }
        totalAssignments: { type: integer }
        pendingAssignments: { type: integer }
        submittedAssignments: { type: integer }
        lateAssignments: { type: integer }
        gradedAssignments: { type: integer }
        upcomingDeadlines:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        recentFeedback:
          type: array
          items: { $ref: "#/components/schemas/Submission" }
    TeacherDashboard:
      type: object
      required: [totalAssignments, totalStudents, totalSubmissions, pendingReviews, lateSubmissions, gradedSubmissions, recentUploads, upcomingDeadlines]
      properties:
        totalAssignments: { type: integer }
        totalStudents: { type: integer }
        totalSubmissions: { type: integer }
        pendingReviews: { type: integer }
        lateSubmissions: { type: integer }
        gradedSubmissions: { type: integer }
        recentUploads:
          type: array
          items: { $ref: "#/components/schemas/Submission" }
        upcomingDeadlines:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }